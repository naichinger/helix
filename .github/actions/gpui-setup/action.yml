name: GPUI system dependencies
description: Install the Linux development libraries required by GPUI.
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libclang-dev libssl-dev libfontconfig1-dev \
          libfreetype6-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
          libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev libxi-dev \
          libxrandr-dev libvulkan-dev
